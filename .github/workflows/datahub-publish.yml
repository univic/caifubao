name: Build Datahub Image

on:
  workflow_run:
    workflows: ["CI - Test & Quality Check"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: caifubao-datahub
  DEFAULT_PRIVATE_REPOSITORY: univic/caifubao-private

concurrency:
  group: publish-datahub-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop')) && 'development' || 'production' }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Detect datahub changes
        id: changes
        run: |
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r -m "${SOURCE_SHA}" | sort -u)"

          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -E -q '^(datahub/|backend/app/utilities/|backend/app/model/|\.github/workflows/datahub-publish\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy backend utilities and models
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p datahub/app/utilities
          cp -r backend/app/utilities/* datahub/app/utilities/
          mkdir -p datahub/app/model
          cp -r backend/app/model/* datahub/app/model/

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Compute image tag
        id: image-tag
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        run: |
          echo "immutable_tag=sha-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY_HOST }}/${{ secrets.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.immutable_tag }}
            type=raw,value=develop,enable=${{ env.SOURCE_BRANCH == 'develop' }}
            type=raw,value=prod,enable=${{ env.SOURCE_BRANCH == 'main' }}
            type=raw,value=latest,enable=${{ env.SOURCE_BRANCH == 'main' }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./datahub
          file: ./datahub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Dispatch private datahub deploy
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
          PRIVATE_REPOSITORY: ${{ env.DEFAULT_PRIVATE_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.immutable_tag }}
          SERVICE: datahub
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing PRIVATE_REPO_DISPATCH_TOKEN secret"
            exit 1
          fi

          case "$SOURCE_BRANCH" in
            develop)
              TARGET_ENVIRONMENT="development"
              ;;
            main)
              TARGET_ENVIRONMENT="production"
              ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          JSON_PAYLOAD="$(cat <<EOF
          {
            "event_type": "${SERVICE}_deploy",
            "client_payload": {
              "environment": "${TARGET_ENVIRONMENT}",
              "mode": "deploy",
              "image_tag": "${IMAGE_TAG}",
              "commit_sha": "${SOURCE_SHA}",
              "public_repository": "${GITHUB_REPOSITORY}",
              "public_ref": "${SOURCE_SHA}",
              "bootstrap": false,
              "skip_ingress": true
            }
          }
          EOF
          )"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPOSITORY}/dispatches" \
            -d "${JSON_PAYLOAD}"

      - name: Write publish summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            case "$SOURCE_BRANCH" in
              develop)
                TARGET_ENVIRONMENT="development"
                CHANNEL_TAG="develop"
                ;;
              main)
                TARGET_ENVIRONMENT="production"
                CHANNEL_TAG="prod, latest"
                ;;
              *)
                TARGET_ENVIRONMENT="unsupported"
                CHANNEL_TAG="none"
                ;;
            esac

            echo "::notice title=Datahub image published::environment=${TARGET_ENVIRONMENT}, image_tag=${{ steps.image-tag.outputs.immutable_tag }}, source_sha=${SOURCE_SHA}, private_workflow=datahub-deploy.yml"

            {
              echo "## Datahub Image Published"
              echo ""
              echo "- Service: \`datahub\`"
              echo "- Private deploy workflow: \`Deploy Datahub\` / \`datahub-deploy.yml\`"
              echo "- Target environment: \`${TARGET_ENVIRONMENT}\`"
              echo "- Source branch: \`${SOURCE_BRANCH}\`"
              echo "- Source SHA: \`${SOURCE_SHA}\`"
              echo "- Immutable image tag: \`${{ steps.image-tag.outputs.immutable_tag }}\`"
              echo "- Channel tag(s): \`${CHANNEL_TAG}\`"
              echo "- Private dispatch repository: \`${{ env.DEFAULT_PRIVATE_REPOSITORY }}\`"
              echo ""
              echo "### Manual Private Deploy"
              echo ""
              echo "\`\`\`bash"
              echo "gh workflow run datahub-deploy.yml --repo ${{ env.DEFAULT_PRIVATE_REPOSITORY }} --ref main \\"
              echo "  -f environment=${TARGET_ENVIRONMENT} \\"
              echo "  -f mode=deploy \\"
              echo "  -f image_tag=${{ steps.image-tag.outputs.immutable_tag }} \\"
              echo "  -f public_repository=${GITHUB_REPOSITORY} \\"
              echo "  -f public_ref=${SOURCE_SHA} \\"
              echo "  -f bootstrap=false \\"
              echo "  -f skip_ingress=true"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No datahub changes detected for ${SOURCE_SHA}; skipped image publish." >> "$GITHUB_STEP_SUMMARY"
          fi
