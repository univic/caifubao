name: Trading Domain Isolation

on:
  pull_request:
    branches: [develop, main, feature/strategy-engine-unification]
    paths:
      - 'trading/**'
      - 'shared/**'
      - '.github/workflows/trading-domain.yml'
  push:
    branches: [develop, main]
    paths:
      - 'trading/**'
      - 'shared/**'
      - '.github/workflows/trading-domain.yml'

jobs:
  trading-offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared contracts and Ruff
        run: |
          python -m pip install -e ./shared
          python -m pip install ruff==0.15.15
      - name: No cross-domain imports; lint and format
        run: |
          if grep -R -E '^from (datahub|app\.lib\.strategy_engine)|^import (datahub|app\.lib\.strategy_engine)' trading/caifubao_trading; then
            echo "Trading runtime imported the research domain"
            exit 1
          fi
          ruff check trading/
          ruff format --check trading/
      - name: Isolated offline Trading unit tests
        run: |
          PYTHONPATH=trading python -m unittest discover -s trading/tests -p 'test_*.py' -v
