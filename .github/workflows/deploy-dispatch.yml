name: Dispatch Private Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
          - datahub
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      image_tag:
        description: Image tag to deploy. Defaults to sha-<commit-sha-short>.
        required: false
        type: string
      public_ref:
        description: Public ref or commit SHA to deploy. Defaults to the triggering SHA.
        required: false
        type: string
      private_repository:
        description: Private overlay repository (owner/name)
        required: false
        type: string
      bootstrap:
        description: Allow bootstrap deployment in development
        required: true
        default: false
        type: boolean
      skip_ingress:
        description: Skip ingress during bootstrap deploy
        required: true
        default: true
        type: boolean

env:
  DEFAULT_PRIVATE_REPOSITORY: univic/caifubao-private

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      public_ref: ${{ steps.resolve.outputs.public_ref }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      bootstrap: ${{ steps.resolve.outputs.bootstrap }}
      skip_ingress: ${{ steps.resolve.outputs.skip_ingress }}
      private_repository: ${{ steps.resolve.outputs.private_repository }}
      services_json: ${{ steps.resolve.outputs.services_json }}
      trigger_kind: ${{ steps.resolve.outputs.trigger_kind }}
      should_dispatch: ${{ steps.changes.outputs.should_dispatch || 'true' }}
    steps:
      - name: Resolve dispatch inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUBLIC_REF: ${{ inputs.public_ref }}
          INPUT_PRIVATE_REPOSITORY: ${{ inputs.private_repository }}
          INPUT_BOOTSTRAP: ${{ inputs.bootstrap }}
          INPUT_SKIP_INGRESS: ${{ inputs.skip_ingress }}
          DEFAULT_PRIVATE_REPOSITORY: ${{ env.DEFAULT_PRIVATE_REPOSITORY }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER_KIND="manual"
            TARGET_ENV="${INPUT_ENVIRONMENT:-development}"
            COMMIT_SHA="${INPUT_PUBLIC_REF:-${GITHUB_SHA}}"
            PUBLIC_REF="${INPUT_PUBLIC_REF:-${GITHUB_SHA}}"
            IMAGE_TAG="${INPUT_IMAGE_TAG:-}"
            SERVICES="${INPUT_SERVICE:-all}"
            BOOTSTRAP="${INPUT_BOOTSTRAP:-false}"
            SKIP_INGRESS="${INPUT_SKIP_INGRESS:-true}"
            PRIVATE_REPOSITORY="${INPUT_PRIVATE_REPOSITORY:-$DEFAULT_PRIVATE_REPOSITORY}"
          else
            TRIGGER_KIND="automatic"
            COMMIT_SHA="${WORKFLOW_SHA}"
            PUBLIC_REF="${WORKFLOW_SHA}"
            IMAGE_TAG=""
            case "$WORKFLOW_BRANCH" in
              develop)
                TARGET_ENV="development"
                ;;
              main)
                TARGET_ENV="production"
                ;;
              *)
                echo "Unsupported triggering branch: $WORKFLOW_BRANCH"
                exit 1
                ;;
            esac
            case "$WORKFLOW_NAME" in
              "Build Backend Image")
                SERVICES="backend"
                ;;
              "Build Frontend Image")
                SERVICES="frontend"
                ;;
              "Build Datahub Image")
                SERVICES="datahub"
                ;;
              *)
                echo "Unsupported triggering workflow: $WORKFLOW_NAME"
                exit 1
                ;;
            esac
            BOOTSTRAP="false"
            SKIP_INGRESS="true"
            PRIVATE_REPOSITORY="$DEFAULT_PRIVATE_REPOSITORY"
          fi

          if [ -z "$COMMIT_SHA" ]; then
            echo "Missing commit SHA"
            exit 1
          fi

          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="sha-${COMMIT_SHA}"
            IMAGE_TAG="${IMAGE_TAG:0:16}"
          fi

          case "$SERVICES" in
            all)
              SERVICES_JSON='["backend","frontend","datahub"]'
              ;;
            backend|frontend|datahub)
              SERVICES_JSON="[\"$SERVICES\"]"
              ;;
            *)
              echo "Unsupported service selection: $SERVICES"
              exit 1
              ;;
          esac

          echo "environment=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "public_ref=$PUBLIC_REF" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$BOOTSTRAP" >> "$GITHUB_OUTPUT"
          echo "skip_ingress=$SKIP_INGRESS" >> "$GITHUB_OUTPUT"
          echo "private_repository=$PRIVATE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "services_json=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "trigger_kind=$TRIGGER_KIND" >> "$GITHUB_OUTPUT"

      - name: Checkout source commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.public_ref }}
          fetch-depth: 0

      - name: Detect deploy-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_SHA="${{ steps.resolve.outputs.public_ref }}"
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r -m "${SOURCE_SHA}" | sort -u)"

          printf '%s\n' "$CHANGED_FILES"

          case "${{ github.event.workflow_run.name }}" in
            "Build Backend Image")
              PATTERN='^(backend/|\.github/workflows/backend-publish\.yml$)'
              ;;
            "Build Frontend Image")
              PATTERN='^(frontend/|\.github/workflows/frontend-publish\.yml$)'
              ;;
            "Build Datahub Image")
              PATTERN='^(datahub/|backend/app/utilities/|backend/app/model/|\.github/workflows/datahub-publish\.yml$)'
              ;;
            *)
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if printf '%s\n' "$CHANGED_FILES" | grep -E -q "$PATTERN"; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve.outputs.services_json) }}
    steps:
      - name: Send repository_dispatch to private deploy repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
          PRIVATE_REPOSITORY: ${{ needs.resolve.outputs.private_repository }}
          TARGET_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          PUBLIC_REF: ${{ needs.resolve.outputs.public_ref }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          BOOTSTRAP: ${{ needs.resolve.outputs.bootstrap }}
          SKIP_INGRESS: ${{ needs.resolve.outputs.skip_ingress }}
          SERVICE: ${{ matrix.service }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing PRIVATE_REPO_DISPATCH_TOKEN secret"
            exit 1
          fi

          EVENT_TYPE="${SERVICE}_deploy"
          JSON_PAYLOAD="$(cat <<EOF
          {
            "event_type": "${EVENT_TYPE}",
            "client_payload": {
              "environment": "${TARGET_ENVIRONMENT}",
              "mode": "deploy",
              "image_tag": "${IMAGE_TAG}",
              "commit_sha": "${COMMIT_SHA}",
              "public_repository": "${GITHUB_REPOSITORY}",
              "public_ref": "${PUBLIC_REF}",
              "bootstrap": ${BOOTSTRAP},
              "skip_ingress": ${SKIP_INGRESS}
            }
          }
          EOF
          )"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPOSITORY}/dispatches" \
            -d "${JSON_PAYLOAD}"

      - name: Write dispatch summary
        run: |
          {
            echo "## Private Deploy Dispatch"
            echo ""
            echo "- Trigger: ${{ needs.resolve.outputs.trigger_kind }}"
            echo "- Service: ${{ matrix.service }}"
            echo "- Environment: ${{ needs.resolve.outputs.environment }}"
            echo "- Image tag: ${{ needs.resolve.outputs.image_tag }}"
            echo "- Commit SHA: ${{ needs.resolve.outputs.commit_sha }}"
            echo "- Public ref: ${{ needs.resolve.outputs.public_ref }}"
            echo "- Private repository: ${{ needs.resolve.outputs.private_repository }}"
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    needs: resolve
    if: needs.resolve.outputs.should_dispatch != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write skipped summary
        run: |
          {
            echo "## Private Deploy Dispatch"
            echo ""
            echo "Skipped because no deploy-relevant service changes were detected for the triggering commit."
          } >> "$GITHUB_STEP_SUMMARY"
