name: Build Backend Image

on:
  workflow_run:
    workflows: ["CI - Test & Quality Check"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: caifubao-backend

concurrency:
  group: publish-backend-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop')) && 'development' || 'production' }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        run: |
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r -m "${SOURCE_SHA}" | sort -u)"

          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | rg -q '^(backend/|\.github/workflows/backend-publish\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Compute image tag
        id: image-tag
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        run: |
          echo "immutable_tag=sha-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY_HOST }}/${{ secrets.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.immutable_tag }}
            type=raw,value=develop,enable=${{ env.SOURCE_BRANCH == 'develop' }}
            type=raw,value=prod,enable=${{ env.SOURCE_BRANCH == 'main' }}
            type=raw,value=latest,enable=${{ env.SOURCE_BRANCH == 'main' }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write publish summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "Backend image published for ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No backend changes detected for ${SOURCE_SHA}; skipped image publish." >> "$GITHUB_STEP_SUMMARY"
          fi
