name: Build MongoDB Tools Image

on:
  workflow_run:
    workflows: ["CI - Test & Quality Check"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: caifubao-mongodb-tools

permissions:
  contents: read

concurrency:
  group: publish-mongodb-tools-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop')) && 'development' || 'production' }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Detect MongoDB tools changes
        id: changes
        run: |
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r -m "${SOURCE_SHA}" | sort -u)"

          printf '%s\n' "$CHANGED_FILES"

          SHOULD_BUILD=false
          if [ -f tools/mongodb-tools/Dockerfile ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
              printf '%s\n' "$CHANGED_FILES" | grep -E -q '^(tools/mongodb-tools/|\.github/workflows/mongodb-tools-publish\.yml$)'; then
              SHOULD_BUILD=true
            fi
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Compute image tag
        id: image-tag
        if: steps.changes.outputs.should_build == 'true'
        run: echo "immutable_tag=sha-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY_HOST }}/${{ secrets.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.immutable_tag }}
            type=raw,value=develop,enable=${{ env.SOURCE_BRANCH == 'develop' }}
            type=raw,value=prod,enable=${{ env.SOURCE_BRANCH == 'main' }}
            type=raw,value=latest,enable=${{ env.SOURCE_BRANCH == 'main' }}

      - name: Build and push Docker image
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./tools/mongodb-tools
          file: ./tools/mongodb-tools/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write publish summary
        run: |
          if [ "${{ steps.changes.outputs.should_build }}" = "true" ]; then
            echo "## MongoDB Tools Image Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Source branch: \`${SOURCE_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Source SHA: \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Immutable image tag: \`${{ steps.image-tag.outputs.immutable_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No publishable MongoDB tools context detected for ${SOURCE_SHA}; skipped image publish." >> "$GITHUB_STEP_SUMMARY"
          fi
