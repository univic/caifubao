name: Build Compute Worker Image

on:
  workflow_run:
    workflows: ["CI - Test & Quality Check"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: caifubao-compute-worker
  DEFAULT_PRIVATE_REPOSITORY: univic/caifubao-private

concurrency:
  group: publish-compute-worker-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ (github.event_name == 'workflow_dispatch' && (github.ref_name == 'develop' || github.ref_name == 'main')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop')) && 'development' || 'production' }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      # The image bakes the backend app and the datahub model/lib overlay, so a
      # change in any of those trees requires a rebuild.
      - name: Detect compute-worker changes
        id: changes
        run: |
          CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r -m "${SOURCE_SHA}" | sort -u)"

          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -E -q '^(compute-worker/|backend/|datahub/app/(model|lib)/|shared/|\.github/workflows/compute-worker-publish\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Compute image tag
        id: image-tag
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        run: |
          echo "immutable_tag=sha-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY_HOST }}/${{ secrets.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.immutable_tag }}
            type=raw,value=develop,enable=${{ env.SOURCE_BRANCH == 'develop' }}
            type=raw,value=prod,enable=${{ env.SOURCE_BRANCH == 'main' }}
            type=raw,value=latest,enable=${{ env.SOURCE_BRANCH == 'main' }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          # The worker image imports backend + datahub code, so the build context
          # is the repository root (see .dockerignore).
          context: .
          file: ./compute-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Dispatch private compute-worker deploy
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
          PRIVATE_REPOSITORY: ${{ env.DEFAULT_PRIVATE_REPOSITORY }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.immutable_tag }}
          SERVICE: compute-worker
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing PRIVATE_REPO_DISPATCH_TOKEN secret"
            exit 1
          fi

          case "$SOURCE_BRANCH" in
            develop)
              TARGET_ENVIRONMENT="dev"
              ;;
            main)
              TARGET_ENVIRONMENT="research"
              ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          JSON_PAYLOAD="$(cat <<EOF
          {
            "event_type": "${SERVICE}_deploy",
            "client_payload": {
              "environment": "${TARGET_ENVIRONMENT}",
              "mode": "deploy",
              "image_tag": "${IMAGE_TAG}",
              "commit_sha": "${SOURCE_SHA}",
              "public_repository": "${GITHUB_REPOSITORY}",
              "public_ref": "${SOURCE_SHA}",
              "bootstrap": false,
              "skip_ingress": true
            }
          }
          EOF
          )"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_REPOSITORY}/dispatches" \
            -d "${JSON_PAYLOAD}"

      - name: Write publish summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "::notice title=Compute-worker image published::image_tag=${{ steps.image-tag.outputs.immutable_tag }}, source_sha=${SOURCE_SHA}"
            {
              echo "## Compute Worker Image Published"
              echo ""
              echo "- Service: \`compute-worker\`"
              echo "- Source branch: \`${SOURCE_BRANCH}\`"
              echo "- Source SHA: \`${SOURCE_SHA}\`"
              echo "- Immutable image tag: \`${{ steps.image-tag.outputs.immutable_tag }}\`"
              echo "- Private dispatch event: \`compute-worker_deploy\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compute-worker changes detected for ${SOURCE_SHA}; skipped image publish." >> "$GITHUB_STEP_SUMMARY"
          fi
