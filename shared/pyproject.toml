[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caifubao-contracts"
version = "0.1.0"
description = "Shared MongoDB models, execution-cost and time contracts for caifubao services"
requires-python = ">=3.12"
dependencies = ["mongoengine>=0.29"]

[tool.setuptools.packages.find]
include = ["caifubao_contracts*"]

# The consumer manifest is a data file the contract reads at validation time.
# Without this the wheel ships only .py files and every v2 declaration fails at
# runtime with a missing manifest - which is exactly what happened once already.
[tool.setuptools.package-data]
caifubao_contracts = ["*.json"]
