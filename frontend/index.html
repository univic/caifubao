      字体方案：

      以获得完整的可变字体体验。
    -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/fontsource-inter/5.0.18/index.min.css">

        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
