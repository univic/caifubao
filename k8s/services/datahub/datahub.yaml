apiVersion: apps/v1
kind: Deployment
metadata:
  name: caifubao-datahub
  labels:
    app: caifubao-datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caifubao-datahub
  template:
    metadata:
      labels:
        app: caifubao-datahub
    spec:
      containers:
      - name: datahub
        image: caifubao-datahub:latest
        imagePullPolicy: Always
        env:
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_PORT
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_NAME
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_USER
        - name: MONGODB_PASS
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_PASSWORD
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYMONGO_LOG_LEVEL
          value: "INFO"
        - name: DATAHUB_ENABLE_LEGACY_SCHEDULER
          value: "false"
        - name: DATAHUB_STARTUP_CATCHUP_ENABLED
          value: "true"
        - name: HEALTH_CHECK_LOG_ENABLED
          value: "false"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      imagePullSecrets:
      - name: ccr-secret
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: caifubao-datahub-quote-index
  labels:
    app: caifubao-datahub
    job.caifubao.io/type: quote-index
spec:
  schedule: "0 18 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: caifubao-datahub
            job.caifubao.io/type: quote-index
        spec:
          restartPolicy: Never
          containers:
          - name: quote-index-runner
            image: caifubao-datahub:latest
            imagePullPolicy: Always
            command: ["python", "-m", "app.jobs.quote_runner"]
            args:
            - --target
            - index
            - --job-name
            - datahub_quote_index_daily
            - --job-family
            - quote_daily
            - --trigger
            - cron
            - --source
            - k8s-cronjob
            - --scheduled-hour
            - "18"
            - --scheduled-minute
            - "0"
            env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_PORT
            - name: MONGODB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_NAME
            - name: MONGODB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_USER
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: datahub-secret
                  key: MONGODB_PASSWORD
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYMONGO_LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          imagePullSecrets:
          - name: ccr-secret
---
