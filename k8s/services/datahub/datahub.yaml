---
apiVersion: v1
kind: Service
metadata:
  name: caifubao-datahub-service
  labels:
    app: caifubao-datahub
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: caifubao-datahub
