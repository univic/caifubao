apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-backup-config
data:
  AWS_ENDPOINT_URL: "https://s3.example.com"
  AWS_DEFAULT_REGION: "auto"
  S3_BUCKET: "caifubao-backups-example"
  S3_PREFIX: "mongodb"
  MONGODB_BACKUP_DATABASE: "caifubao"
  MONGODB_BACKUP_NAMESPACE: "caifubao-example"
  MONGODB_REQUIRED_COLLECTIONS: "basic_stock,stock_daily_quote,stock_factor_daily,stock_signal_daily,stock_score_predictions,data_asset_status"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-backup-secret
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "change-me-example"
  AWS_SECRET_ACCESS_KEY: "change-me-example"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-backup-scripts
data:
  aws-config: |
    [default]
    s3 =
      addressing_style = virtual
  backup.sh: |
    #!/usr/bin/env sh
    set -eu

    : "${MONGODB_HOST:?MONGODB_HOST is required}"
    : "${MONGODB_PORT:?MONGODB_PORT is required}"
    : "${MONGODB_USER:?MONGODB_USER is required}"
    : "${MONGODB_PASS:?MONGODB_PASS is required}"
    : "${MONGODB_BACKUP_DATABASE:?MONGODB_BACKUP_DATABASE is required}"
    : "${S3_BUCKET:?S3_BUCKET is required}"
    : "${S3_PREFIX:?S3_PREFIX is required}"

    started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    archive="/work/${MONGODB_BACKUP_DATABASE}-${stamp}.archive.gz"
    object_key="${S3_PREFIX%/}/${MONGODB_BACKUP_DATABASE}/${stamp}.archive.gz"
    status="failed"
    error_summary=""

    finish() {
      finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      printf '{"started_at":"%s","finished_at":"%s","status":"%s","database":"%s","namespace":"%s","object_key":"%s","error_summary":"%s"}\n' \
        "$started_at" "$finished_at" "$status" "$MONGODB_BACKUP_DATABASE" "${MONGODB_BACKUP_NAMESPACE:-}" "$object_key" "$error_summary"
    }
    trap finish EXIT

    if ! mongodump \
      --host "$MONGODB_HOST" \
      --port "$MONGODB_PORT" \
      --username "$MONGODB_USER" \
      --password "$MONGODB_PASS" \
      --authenticationDatabase admin \
      --db "$MONGODB_BACKUP_DATABASE" \
      --archive="$archive" \
      --gzip; then
      error_summary="mongodump failed"
      exit 1
    fi

    aws_endpoint_arg=""
    if [ -n "${AWS_ENDPOINT_URL:-}" ]; then
      aws_endpoint_arg="--endpoint-url=${AWS_ENDPOINT_URL}"
    fi

    if ! aws $aws_endpoint_arg s3 cp "$archive" "s3://${S3_BUCKET}/${object_key}"; then
      error_summary="object storage upload failed"
      exit 1
    fi

    status="succeeded"
  restore.sh: |
    #!/usr/bin/env sh
    set -eu

    : "${MONGODB_HOST:?MONGODB_HOST is required}"
    : "${MONGODB_PORT:?MONGODB_PORT is required}"
    : "${MONGODB_USER:?MONGODB_USER is required}"
    : "${MONGODB_PASS:?MONGODB_PASS is required}"
    : "${MONGODB_BACKUP_DATABASE:?MONGODB_BACKUP_DATABASE is required}"
    : "${S3_BUCKET:?S3_BUCKET is required}"
    : "${MONGODB_RESTORE_OBJECT_KEY:?MONGODB_RESTORE_OBJECT_KEY is required}"

    aws_endpoint_arg=""
    if [ -n "${AWS_ENDPOINT_URL:-}" ]; then
      aws_endpoint_arg="--endpoint-url=${AWS_ENDPOINT_URL}"
    fi

    # Stream the archive from object storage straight into mongorestore
    # (--archive=- reads stdin). Writing the archive to disk first fills
    # ephemeral storage on small nodes and triggers kubelet eviction.
    aws $aws_endpoint_arg s3 cp "s3://${S3_BUCKET}/${MONGODB_RESTORE_OBJECT_KEY}" - | \
      mongorestore \
        --host "$MONGODB_HOST" \
        --port "$MONGODB_PORT" \
        --username "$MONGODB_USER" \
        --password "$MONGODB_PASS" \
        --authenticationDatabase admin \
        --archive=- \
        --gzip \
        --drop
  sanity-check.sh: |
    #!/usr/bin/env sh
    set -eu

    : "${MONGODB_HOST:?MONGODB_HOST is required}"
    : "${MONGODB_PORT:?MONGODB_PORT is required}"
    : "${MONGODB_USER:?MONGODB_USER is required}"
    : "${MONGODB_PASS:?MONGODB_PASS is required}"
    : "${MONGODB_BACKUP_DATABASE:?MONGODB_BACKUP_DATABASE is required}"

    mongosh \
      --host "$MONGODB_HOST" \
      --port "$MONGODB_PORT" \
      --username "$MONGODB_USER" \
      --password "$MONGODB_PASS" \
      --authenticationDatabase admin \
      "$MONGODB_BACKUP_DATABASE" \
      --quiet \
      --eval '
        const required = (process.env.MONGODB_REQUIRED_COLLECTIONS || "").split(",").filter(Boolean);
        const existing = new Set(db.getCollectionNames());
        const result = {
          database: db.getName(),
          checked_at: new Date().toISOString(),
          collections: {},
          missing: []
        };
        for (const name of required) {
          if (!existing.has(name)) {
            result.collections[name] = {exists: false, count: 0};
            result.missing.push(name);
            continue;
          }
          result.collections[name] = {exists: true, count: db.getCollection(name).estimatedDocumentCount()};
        }
        print(JSON.stringify(result));
        if (result.missing.length > 0) {
          quit(2);
        }
      '
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-s3-backup
  labels:
    job.caifubao.io/type: mongodb-backup
spec:
  schedule: "30 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            job.caifubao.io/type: mongodb-backup
        spec:
          restartPolicy: Never
          containers:
          - name: mongodb-backup
            image: caifubao-mongodb-tools:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/backup.sh"]
            envFrom:
            - configMapRef:
                name: mongodb-backup-config
            - secretRef:
                name: mongodb-backup-secret
            env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_PORT
            - name: MONGODB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_USER
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_ROOT_PASSWORD
            volumeMounts:
            - name: aws-config
              mountPath: /root/.aws
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          volumes:
          - name: aws-config
            configMap:
              name: mongodb-backup-scripts
              items:
              - key: aws-config
                path: config
          - name: scripts
            configMap:
              name: mongodb-backup-scripts
              defaultMode: 0755
          - name: work
            emptyDir: {}
