apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-worker
  labels:
    app: caifubao
    component: compute-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caifubao
      component: compute-worker
  template:
    metadata:
      labels:
        app: caifubao
        component: compute-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute
      containers:
      - name: compute-worker
        image: caifubao/compute-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        # Same connection contract as the backend/datahub: no separate Secret.
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_PORT
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_NAME
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_USER
        - name: MONGODB_PASS
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_PASSWORD
        - name: POLL_INTERVAL
          value: "5"
        - name: MAX_CONCURRENT_TASKS
          value: "1"
        - name: TASK_MAX_RETRIES
          value: "3"
        - name: TASK_STALE_MINUTES
          value: "360"
        - name: HEARTBEAT_FILE
          value: "/tmp/compute-worker.heartbeat"
        - name: HEARTBEAT_STALE_SECONDS
          value: "300"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "6"
            memory: "28Gi"
        # The worker touches HEARTBEAT_FILE on every poll cycle; a wedged
        # process (or a busy loop that stopped claiming) is restarted. The old
        # probe was `python -c "sys.exit(0)"` and could never fail.
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import os, sys, time
              path = os.environ.get("HEARTBEAT_FILE", "/tmp/compute-worker.heartbeat")
              limit = int(os.environ.get("HEARTBEAT_STALE_SECONDS", "300"))
              if not os.path.exists(path):
                  sys.exit(1)
              sys.exit(0 if time.time() - os.path.getmtime(path) < limit else 1)
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        # Readiness checks that the merged app package and the Mongo connection
        # layer import cleanly before the worker is considered usable.
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import worker_app.worker, app.model.compute_task"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
      imagePullSecrets:
      - name: ccr-secret
      restartPolicy: Always
