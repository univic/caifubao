apiVersion: apps/v1
kind: Deployment
metadata:
  name: caifubao-datahub
  labels:
    app: caifubao-datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caifubao-datahub
  template:
    metadata:
      labels:
        app: caifubao-datahub
    spec:
      containers:
      - name: datahub
        image: caifubao-datahub:latest
        imagePullPolicy: Always
        env:
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_PORT
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_NAME
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_USER
        - name: MONGODB_PASS
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_PASSWORD
        - name: MONGODB_SRC_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_SRC_HOST
        - name: MONGODB_SRC_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_SRC_PORT
        - name: MONGODB_SRC_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_SRC_NAME
        - name: MONGODB_SRC_USER
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_SRC_USER
        - name: MONGODB_SRC_PASS
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_SRC_PASS
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYMONGO_LOG_LEVEL
          value: "INFO"
        - name: DATAHUB_ENABLE_LEGACY_SCHEDULER
          value: "false"
        - name: DATAHUB_STARTUP_CATCHUP_ENABLED
          value: "true"
        - name: TUSHARE_TOKEN
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: TUSHARE_TOKEN
        # Keep quote history/universe on the tushare pro API in every
        # environment: akshare/eastmoney history endpoints drop connections
        # under sustained polling and can stall full-market catchup runs.
        - name: DATAHUB_STOCK_HISTORY_SOURCE
          value: "tushare"
        - name: DATAHUB_STOCK_UNIVERSE_SOURCE
          value: "tushare"
        - name: HEALTH_CHECK_LOG_ENABLED
          value: "false"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      imagePullSecrets:
      - name: ccr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: caifubao-datahub-service
  labels:
    app: caifubao-datahub
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: caifubao-datahub
