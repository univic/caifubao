# Stock-timing input capture Job (example).
#
# Phase 2 of the forward PIT evidence chain: `capture-pit-inputs` binds the
# frozen universe artifact to the session's complete ranked-scoring read set.
# It must run after the session closes and before the next session opens; a
# late run is rejected, not silently downgraded.
#
# `--model-version` must name a registered ACTIVE ranked model; the command
# fails closed otherwise. The value below is the research shadow model used by
# the stock-timing baseline.
#
# Writes /artifacts/ranked-inputs-<session>.json on the stock-timing-artifacts
# PVC (k8s/base/stock-timing-artifacts.example.yaml) and refuses to overwrite.
# Each session needs its own output path and Job.
#
# `CAIFUBAO_BUILD_REVISION` is baked into the published image from the source
# revision. The CLI rejects an empty value but cannot detect a wrong one, so add
# an explicit entry to the `env:` block only if the image does not carry it, and
# set it to the exact immutable revision.
#
# Prefer the one-off Job launcher in the private overlay, which copies the live
# datahub Deployment's image, revision and generated ConfigMap names.
apiVersion: batch/v1
kind: Job
metadata:
  name: stock-timing-inputs
  labels:
    app: caifubao-datahub
    job.caifubao.io/type: stock-timing-inputs
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: caifubao-datahub
        job.caifubao.io/type: stock-timing-inputs
    spec:
      restartPolicy: Never
      containers:
      - name: stock-timing-inputs
        image: caifubao-datahub:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.jobs.scoring_runner", "capture-pit-inputs"]
        args:
        - --universe-artifact
        - /artifacts/universe-2026-09-16.json
        - --model-version
        - flip_wide_shadow_v1
        - --horizons
        - "20"
        - --output
        - /artifacts/ranked-inputs-2026-09-16.json
        env:
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_PORT
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_NAME
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_USER
        - name: MONGODB_PASS
          valueFrom:
            secretKeyRef:
              name: datahub-secret
              key: MONGODB_PASSWORD
        volumeMounts:
        - name: stock-timing-artifacts
          mountPath: /artifacts
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: stock-timing-artifacts
        persistentVolumeClaim:
          claimName: stock-timing-artifacts
      imagePullSecrets:
      - name: ccr-secret
