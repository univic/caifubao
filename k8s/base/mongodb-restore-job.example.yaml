apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-s3-restore
  labels:
    job.caifubao.io/type: mongodb-restore
spec:
  backoffLimit: 0
  # No activeDeadlineSeconds here on purpose. It is a hang guard, not a
  # slow-job timer: a copied 2h/4h deadline killed two real restores mid-run.
  # Protect long restores with ttlSecondsAfterFinished plus monitoring.
  #
  # This example streams one archive into one mongorestore call, which is only
  # suitable for small databases. For a multi-GB database, download the
  # archive to a staging volume first and restore it collection by collection
  # (mongorestore --nsInclude --stopOnError) so an interruption does not
  # discard every completed collection.
  template:
    metadata:
      labels:
        job.caifubao.io/type: mongodb-restore
    spec:
      restartPolicy: Never
      containers:
      - name: mongodb-restore
        image: caifubao-mongodb-tools:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - /scripts/restore.sh && /scripts/sanity-check.sh
        envFrom:
        - configMapRef:
            name: mongodb-backup-config
        - secretRef:
            name: mongodb-backup-secret
        env:
        - name: MONGODB_RESTORE_OBJECT_KEY
          value: "mongodb/caifubao/YYYYMMDDTHHMMSSZ.archive.gz"
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_PORT
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MONGODB_USER
        - name: MONGODB_PASS
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGODB_ROOT_PASSWORD
        volumeMounts:
        - name: aws-config
          mountPath: /root/.aws
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: aws-config
        configMap:
          name: mongodb-backup-scripts
          items:
          - key: aws-config
            path: config
      - name: scripts
        configMap:
          name: mongodb-backup-scripts
          defaultMode: 0755
      - name: work
        emptyDir: {}
