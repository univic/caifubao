# Example research-environment datahub CronJobs.
#
# TASK-303 gives the research environment its own overlay instead of reusing
# the production one. The job shapes start identical to example-production
# because research is production-shaped (full history, same schedules); diverge
# here deliberately rather than in a namespace patch.
#
# Every writer below ships `suspend: true` on purpose: during the TASK-404
# transition the research chain must never run unattended beside the old
# stable chain (one-writer-at-a-time). Private overlays drive the live value
# via DATAHUB_*_SUSPEND env patches; enable one writer per verified step.
#
apiVersion: batch/v1
kind: CronJob
metadata:
  name: caifubao-datahub-quote-index
  labels:
    app: caifubao-datahub
    job.caifubao.io/type: quote-index
spec:
  schedule: "0 18 * * 1-5"
  # Suspended during the TASK-404 transition; private overlays override
  # per writer via DATAHUB_*_SUSPEND.
  suspend: true
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: caifubao-datahub
            job.caifubao.io/type: quote-index
        spec:
          restartPolicy: Never
          containers:
          - name: quote-index-runner
            image: caifubao-datahub:latest
            imagePullPolicy: Always
            command: ["python", "-m", "app.jobs.quote_runner"]
            args:
            - --target
            - index
            - --job-name
            - datahub_quote_index_daily
            - --job-family
            - quote_daily
            - --trigger
            - cron
            - --source
            - k8s-cronjob
            - --scheduled-hour
            - "18"
            - --scheduled-minute
            - "0"
            env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_PORT
            - name: MONGODB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_NAME
            - name: MONGODB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_USER
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: datahub-secret
                  key: MONGODB_PASSWORD
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYMONGO_LOG_LEVEL
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          imagePullSecrets:
          - name: ccr-secret
---
