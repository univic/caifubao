apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caifubao-example
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: caifubao-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: caifubao-backend-service
            port:
              number: 8000
