        spec:
          template:
            spec:
              imagePullSecrets:
              - name: ccr-secret
              nodeSelector:
                class: compute
                provider: tencent
              containers:
              - name: quote-stock-runner
                env:
                - name: MONGODB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: prod-mongodb-pass-secret
                      key: PROD_MONGODB_PASS

- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-signal
