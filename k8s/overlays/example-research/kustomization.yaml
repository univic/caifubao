apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caifubao-example

resources:
- ../../base
- ingress.yaml
- datahub-cronjobs.yaml

configMapGenerator:
- name: backend-config
  literals:
  - MONGODB_HOST=mongodb-service
  - MONGODB_PORT=27017
  - MONGODB_NAME=caifubao
  - MONGODB_USER=root
  - ENVIRONMENT=PRODUCTION
  - FLASK_HOST=0.0.0.0
  - FLASK_PORT=8000
  - FLASK_DEBUG=false
- name: data-lake-export-config
  behavior: replace
  literals:
  - DATA_LAKE_ENDPOINT_URL=https://s3.example.com
  - DATA_LAKE_REGION=auto
  - DATA_LAKE_BUCKET=caifubao-data-lake-example
  - DATA_LAKE_PREFIX=data-lake
  - DATA_LAKE_LOOKBACK_DAYS=7

secretGenerator:
- name: backend-secret
  literals:
  - MONGODB_PASSWORD=change-me-example
  - SECRET_KEY=change-me-production-secret
  - JWT_SECRET_KEY=change-me-production-jwt-secret
  - SECURITY_PASSWORD_SALT=change-me-production-password-salt
- name: datahub-secret
  literals:
  - MONGODB_PASSWORD=change-me-example
  - TUSHARE_TOKEN=PLACEHOLDER_TUSHARE_TOKEN
- name: mongodb-secret
  literals:
  - MONGODB_ROOT_PASSWORD=change-me-example
- name: data-lake-export-secret
  behavior: replace
  literals:
  - AWS_ACCESS_KEY_ID=change-me-example
  - AWS_SECRET_ACCESS_KEY=change-me-example

images:
- name: caifubao-backend
  newName: registry.example.com/your-org/caifubao-backend
  newTag: prod
- name: caifubao-frontend
  newName: registry.example.com/your-org/caifubao-frontend
  newTag: prod
- name: caifubao-datahub
  newName: registry.example.com/your-org/caifubao-datahub
  newTag: prod
- name: caifubao-mongodb-tools
  newName: registry.example.com/your-org/caifubao-mongodb-tools
  newTag: prod
- name: caifubao/compute-worker
  newName: registry.example.com/your-org/caifubao-compute-worker
  newTag: prod

patches:
- path: backend-secret-env-patch.yaml
- path: backend-secret-override.yaml
- target:
    group: apps
    version: v1
    kind: Deployment
    name: caifubao-frontend
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: provider
                operator: In
                values:
                - tencent

- target:
    group: apps
    version: v1
    kind: Deployment
    name: compute-worker
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: compute-worker
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ccr-secret
          nodeSelector:
            class: compute
            provider: tencent
          containers:
          - name: compute-worker
            env:
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: prod-mongodb-pass-secret
                  key: PROD_MONGODB_PASS

- target:
    group: apps
    version: v1
    kind: Deployment
    name: caifubao-datahub
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: caifubao-datahub
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ccr-secret
          nodeSelector:
            class: compute
            provider: tencent
          containers:
          - name: datahub
            env:
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: prod-mongodb-pass-secret
                  key: PROD_MONGODB_PASS

- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-quote-index
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: caifubao-datahub-quote-index
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: quote-index-runner
                env:
                - name: MONGODB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: prod-mongodb-pass-secret
                      key: PROD_MONGODB_PASS

- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-quote-stock
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
