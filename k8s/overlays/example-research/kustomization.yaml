- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-scoring
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: caifubao-datahub-scoring
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              imagePullSecrets:
              - name: ccr-secret
