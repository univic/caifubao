apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caifubao-example

resources:
- ../../base
- ingress.yaml
- datahub-cronjobs.yaml

configMapGenerator:
- name: backend-config
  literals:
  - MONGODB_HOST=mongodb-service
  - MONGODB_PORT=27017
  - MONGODB_NAME=caifubao
  - MONGODB_USER=root
  - ENVIRONMENT=PRODUCTION
  - FLASK_HOST=0.0.0.0
  - FLASK_PORT=8000
  - FLASK_DEBUG=false
  - MONGODB_SRC_HOST=
  - MONGODB_SRC_PORT=27017
  - MONGODB_SRC_NAME=
  - MONGODB_SRC_USER=
- name: frontend-config
  literals:
  - VITE_API_BASE_URL=/api
- name: data-lake-export-config
  behavior: replace
  literals:
  - DATA_LAKE_ENDPOINT_URL=https://s3.example.com
  - DATA_LAKE_REGION=auto
  - DATA_LAKE_BUCKET=caifubao-data-lake-example
  - DATA_LAKE_PREFIX=data-lake
  - DATA_LAKE_LOOKBACK_DAYS=7

secretGenerator:
- name: backend-secret
  literals:
  - MONGODB_PASSWORD=change-me-example
  - SECRET_KEY=change-me-production-secret
  - JWT_SECRET_KEY=change-me-production-jwt-secret
  - SECURITY_PASSWORD_SALT=change-me-production-password-salt
- name: datahub-secret
  literals:
  - MONGODB_PASSWORD=change-me-example
  - MONGODB_SRC_USER=
  - MONGODB_SRC_PASS=
- name: mongodb-secret
  literals:
  - MONGODB_ROOT_PASSWORD=change-me-example
- name: data-lake-export-secret
  behavior: replace
  literals:
  - AWS_ACCESS_KEY_ID=change-me-example
  - AWS_SECRET_ACCESS_KEY=change-me-example

images:
- name: caifubao-backend
  newName: registry.example.com/your-org/caifubao-backend
  newTag: prod
- name: caifubao-frontend
  newName: registry.example.com/your-org/caifubao-frontend
  newTag: prod
- name: caifubao-datahub
  newName: registry.example.com/your-org/caifubao-datahub
  newTag: prod
- name: caifubao-mongodb-tools
  newName: registry.example.com/your-org/caifubao-mongodb-tools
  newTag: prod

patches:
- path: backend-secret-env-patch.yaml
- path: backend-secret-override.yaml
- target:
    group: apps
    version: v1
    kind: Deployment
    name: caifubao-frontend
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: provider
                operator: In
                values:
                - tencent
- target:
    group: apps
    version: v1
    kind: Deployment
    name: caifubao-datahub
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name
      value: prod-mongodb-pass-secret
    - op: replace
      path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
      value: PROD_MONGODB_PASS
    - op: replace
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: ccr-secret
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        class: compute
        provider: tencent
- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-quote-index
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name
      value: prod-mongodb-pass-secret
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
      value: PROD_MONGODB_PASS
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
      value:
      - name: ccr-secret
    - op: add
      path: /spec/jobTemplate/spec/template/spec/nodeSelector
      value:
        class: compute
        provider: tencent
- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-quote-stock
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name
      value: prod-mongodb-pass-secret
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
      value: PROD_MONGODB_PASS
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
      value:
      - name: ccr-secret
    - op: add
      path: /spec/jobTemplate/spec/template/spec/nodeSelector
      value:
        class: compute
        provider: tencent
- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-signal
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name
      value: prod-mongodb-pass-secret
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
      value: PROD_MONGODB_PASS
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
      value:
      - name: ccr-secret
    - op: add
      path: /spec/jobTemplate/spec/template/spec/nodeSelector
      value:
        class: compute
        provider: tencent
- target:
    group: batch
    version: v1
    kind: CronJob
    name: caifubao-datahub-scoring
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name
      value: prod-mongodb-pass-secret
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/key
      value: PROD_MONGODB_PASS
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
      value:
      - name: ccr-secret
    - op: add
      path: /spec/jobTemplate/spec/template/spec/nodeSelector
      value:
        class: compute
        provider: tencent
