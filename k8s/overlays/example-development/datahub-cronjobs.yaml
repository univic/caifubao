apiVersion: batch/v1
kind: CronJob
metadata:
  name: caifubao-datahub-health-watcher
  labels:
    app: caifubao-datahub
    job.caifubao.io/type: health-watcher
spec:
  # Post-close local health check. TASK-404 removes the online dev data-sync
  # CronJob; controlled snapshot imports are separate Jobs/operator actions.
  # Run at 20:00 weekdays so stale imported freshness remains visible.
  schedule: "0 20 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: caifubao-datahub
            job.caifubao.io/type: health-watcher
        spec:
          restartPolicy: Never
          containers:
          - name: health-watcher
            image: caifubao-datahub:latest
            imagePullPolicy: Always
            command: ["python", "-m", "app.jobs.health_watcher", "--hours", "26", "--fail-on-issues"]
            env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_PORT
            - name: MONGODB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_NAME
            - name: MONGODB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_USER
            - name: MONGODB_PASS
              valueFrom:
                secretKeyRef:
                  name: datahub-secret
                  key: MONGODB_PASSWORD
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: ENVIRONMENT
            # Optional notification target; private overlays set the real URL.
            # - name: HEALTH_WEBHOOK_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: health-notify
            #       key: webhook-url
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "512Mi"
                cpu: "200m"
          imagePullSecrets:
          - name: ccr-secret
